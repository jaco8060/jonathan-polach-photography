<section class="page-head">
  <h1>Get in touch</h1>
  <p>{{intro}}</p>
</section>
<section class="contact">
  <form id="contact-form" class="form" novalidate data-method="{{method}}" data-email="{{email}}" data-key="{{key}}">
    <div class="field"><label for="f-name">Your name</label><input id="f-name" name="name" required autocomplete="name"></div>
    <div class="field"><label for="f-email">Email</label><input id="f-email" name="email" type="email" required autocomplete="email"></div>
    <div class="row">
      <div class="field"><label for="f-type">What are you planning?</label>
        <select id="f-type" name="shoot_type">{{shootOptions}}</select></div>
      <div class="field"><label for="f-date">Date (if you know it)</label><input id="f-date" name="date" type="date"></div>
    </div>
    <div class="field"><label for="f-message">Tell me about it</label><textarea id="f-message" name="message" rows="6" required></textarea></div>
    <div class="hp" aria-hidden="true"><label>Leave this empty<input name="botcheck" tabindex="-1" autocomplete="off"></label></div>
    {{turnstile}}
    <button class="btn" type="submit">Send message</button>
    <p class="form__status" role="status" aria-live="polite"></p>
  </form>
  <aside class="contact__side">{{details}}</aside>
</section>
